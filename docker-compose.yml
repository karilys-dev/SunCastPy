services:
  suncastpy:
    build:
      context: .
      labels:
        org.opencontainers.image.version: ${VERSION_LABEL:?Missing Variable. Use ./scripts/docker-build.sh}
        org.opencontainers.image.revision: ${GIT_COMMIT:?Missing Variable. Use ./scripts/docker-build.sh}
        org.opencontainers.image.source: "${SOURCE_URL:?Missing Variable. Use ./scripts/docker-build.sh}"
        org.opencontainers.image.title: "SunCastPy"
        org.opencontainers.image.description: "Python weather package for Puerto Rico"
        org.opencontainers.image.url: "${SOURCE_URL:?Missing Variable. Use ./scripts/docker-build.sh}"
        org.opencontainers.image.documentation: "${SOURCE_URL:?Missing Variable. Use ./scripts/docker-build.sh}#readme"
        org.opencontainers.image.created: "${BUILD_DATE:-unknown}"
        org.opencontainers.image.licenses: "MIT"
      args:
        PYTHON_VERSION: "3.14"
        USERNAME: devuser
        USER_UID: 1000
        USER_GID: 1000
        VERSION: ${VERSION}
      target: ${TARGET:-prod}
    image: ${IMAGE_NAME:-weather_api}:${IMAGE_VERSION:-${VERSION_LABEL}}
    container_name: suncastpy-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
