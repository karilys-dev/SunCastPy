
services:
  suncastpy:
    build: 
      context: .
      args:
        PYTHON_VERSION : "3.14"
        USERNAME : devuser
        USER_UID : 1000
        USER_GID : 1000
      target: ${TARGET:-prod}
    image: weather_api:0.0.0-${TARGET:-prod}
    container_name: suncastpy-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
